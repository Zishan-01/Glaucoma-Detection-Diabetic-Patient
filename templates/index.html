{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
<div class="row align-items-center min-vh-75">
    <div class="col-lg-6">
        <h1 class="display-4 fw-bold text-dark-teal">👁️ GlaucomaAI</h1>
        <h2 class="text-muted">AI-Powered Detection for Diabetic Patients</h2>
        <p class="lead mt-3">Using deep learning to detect Glaucoma in fundus images with <strong>100% Recall</strong>.</p>
        <div class="mt-4">
            <a href="{{ url_for('auth.register') }}" class="btn btn-primary-custom btn-lg me-2">Get Started</a>
            <a href="{{ url_for('auth.login') }}" class="btn btn-outline-secondary btn-lg">Login</a>
        </div>
        <div class="mt-4">
            <span class="badge badge-healthy me-2">Secure & HIPAA Compliant</span>
            <span class="badge badge-glaucoma">Powered by MobileNetV2</span>
        </div>
    </div>
    <div class="col-lg-6 text-center">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/Healthy_and_glaucomatous_eye.jpg/640px-Healthy_and_glaucomatous_eye.jpg" 
             class="img-fluid rounded shadow" alt="Glaucoma Detection" style="max-height:350px;">
    </div>
</div>
{% endblock %}
